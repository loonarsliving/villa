<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loonars Private Living</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0A0A0A;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 70% 40%,rgba(196,160,92,.06) 0%,transparent 70%)}
.box{position:relative;z-index:2;width:380px;padding:48px 44px;border:1px solid rgba(255,255,255,.07);border-radius:4px;background:rgba(255,255,255,.02);backdrop-filter:blur(20px)}
.logo-wrap{margin-bottom:36px}
.logo{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:400;color:rgba(255,255,255,.35);letter-spacing:.35em;text-transform:uppercase;margin-bottom:10px}
.tagline{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:#fff;line-height:1.2;letter-spacing:.02em}
.tagline em{font-style:italic;color:#C4A05C}
.divider{width:32px;height:1px;background:#C4A05C;margin:20px 0 32px}
label{display:block;font-size:10px;font-weight:500;color:rgba(255,255,255,.35);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
input{width:100%;padding:12px 0;border:none;border-bottom:1px solid rgba(255,255,255,.12);background:transparent;font-size:13px;font-family:'Inter',sans-serif;color:#fff;outline:none;transition:border-color .2s;margin-bottom:28px}
input::placeholder{color:rgba(255,255,255,.2)}
input:focus{border-bottom-color:#C4A05C}
button{width:100%;padding:14px;background:#C4A05C;color:#0A0A0A;border:none;border-radius:2px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:opacity .2s}
button:hover{opacity:.88}
.err{font-size:11px;color:#E07070;margin-top:14px;text-align:center;display:none;letter-spacing:.03em}
.footer-logo{position:absolute;bottom:28px;right:32px;font-family:'Cormorant Garamond',serif;font-size:10px;color:rgba(255,255,255,.15);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div class="bg"></div>
<div class="box">
  <div class="logo-wrap">
    <div class="logo">Loonars Private Living</div>
    <div class="tagline">Portal <em>Pemilik</em><br>& Operasional</div>
    <div class="divider"></div>
  </div>
  <label>Email</label>
  <input type="email" id="email" placeholder="email@domain.id">
  <label>Password</label>
  <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()" id="btn">Masuk</button>
  <div class="err" id="err">Email atau password tidak valid.</div>
</div>
<div class="footer-logo">PT. Maha Karya Haluoleo</div>
<script>
const API = 'https://svcmybsziaelwwdrnzcv.supabase.co/functions/v1/villa-api';
async function login() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  document.getElementById('btn').textContent = '...';
  document.getElementById('err').style.display = 'none';
  const res = await fetch(API + '/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email, password: pass })
  });
  const data = await res.json();
  document.getElementById('btn').textContent = 'Masuk';
  if (!res.ok) { document.getElementById('err').style.display='block'; return; }
  localStorage.setItem('villa_token', data.token);
  localStorage.setItem('villa_user',  JSON.stringify(data.user));
  location.href = data.user.role === 'receptionist' ? 'receptionist.html' : 'owner.html';
}
</script>
</body>
</html>
