name: Deploy villa-api Edge Function

# Makes supabase/functions/villa-api/index.ts on `main` the single source of
# truth for the live Edge Function -- once this is active, villa-api should
# no longer be edited directly in the Supabase dashboard, only through this
# repo. See supabase/functions/villa-api/README.md for the full procedure
# and why the manual snapshot alone kept drifting out of sync.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/villa-api/**"
  workflow_dispatch: {}

jobs:
  deploy:
    # `workflow_dispatch` bisa dijalankan dari branch mana pun, dan itu akan
    # mendorong villa-api versi branch itu ke PRODUKSI -- diam-diam, karena
    # tidak ada preview/staging untuk Edge Function. Pernah terjadi: run #34
    # (20 Sep 2026) dijalankan dari `claude/loonars-finance-dashboard-wq1oha`.
    # `main` adalah satu-satunya sumber kebenaran, jadi jalur lain ditutup di
    # sini alih-alih mengandalkan kehati-hatian orang yang menekan tombolnya.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy villa-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # --use-api: bundling di server Supabase, bukan di Docker runner.
          # Run #50 (23 Sep 2026) gagal dua kali berturut-turut sebelum satu
          # baris kode pun diunggah, karena ghcr.io menolak unduhan image
          # edge-runtime ("toomanyrequests"). Tanpa Docker, jalur itu hilang.
          supabase functions deploy villa-api \
            --project-ref svcmybsziaelwwdrnzcv \
            --no-verify-jwt \
            --use-api

      # Kegagalan deploy ini SENYAP: aplikasi tetap berjalan karena frontend
      # kompatibel dengan villa-api versi lama, jadi `main` bisa terlihat
      # sudah ter-deploy padahal separuhnya tidak (kejadian 20 Sep 2026,
      # token kedaluwarsa, lihat DEPLOYMENT.md). Versi fungsinya dicetak di
      # sini supaya log run ini sendiri membuktikan deploy-nya benar terjadi.
      - name: Tampilkan versi villa-api setelah deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref svcmybsziaelwwdrnzcv || true
